services:
  openwolf-gateway:
    image: ${OPENWOLF_IMAGE:-openwolf:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENWOLF_GATEWAY_TOKEN: ${OPENWOLF_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENWOLF_CONFIG_DIR}:/home/node/.openwolf
      - ${OPENWOLF_WORKSPACE_DIR}:/home/node/.openwolf/workspace
    ports:
      - "${OPENWOLF_GATEWAY_PORT:-18789}:18789"
      - "${OPENWOLF_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENWOLF_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  openwolf-cli:
    image: ${OPENWOLF_IMAGE:-openwolf:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENWOLF_GATEWAY_TOKEN: ${OPENWOLF_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENWOLF_CONFIG_DIR}:/home/node/.openwolf
      - ${OPENWOLF_WORKSPACE_DIR}:/home/node/.openwolf/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
