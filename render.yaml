services:
  - type: web
    name: openwolf
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENWOLF_STATE_DIR
        value: /data/.openwolf
      - key: OPENWOLF_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENWOLF_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openwolf-data
      mountPath: /data
      sizeGB: 1
